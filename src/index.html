<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover"
    >
    <title>@config(qrcode.meta.title)</title>
    <meta name="description" content="@config(qrcode.meta.description)">
    <link rel="stylesheet" href="css/style.css">
    <script src="js/qrcode.js"></script>
  </head>

  <body
    class="flex items-center justify-center min-h-screen p-4 overflow-x-hidden text-black bg-white dark:bg-black dark:text-white font-orbitron"
  >
    <!-- Theme Toggle -->
    <button
      class="fixed z-50 flex items-center justify-center w-10 h-10 transition-colors bg-white border border-black theme-toggle top-4 right-4 dark:border-white dark:bg-black hover:bg-black hover:text-white dark:hover:bg-white dark:hover:text-black"
      title="Toggle Theme"
      type="button"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        class="w-5 h-5 fill-current"
        viewBox="0 0 24 24"
      >
        <path
          d="M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zM2 13h2c.55 0 1-.45 1-1s-.45-1-1-1H2c-.55 0-1 .45-1 1s.45 1 1 1zm18 0h2c.55 0 1-.45 1-1s-.45-1-1-1h-2c-.55 0-1 .45-1 1s.45 1 1 1zM11 2v2c0 .55.45 1 1 1s1-.45 1-1V2c0-.55-.45-1-1-1s-1 .45-1 1zm0 18v2c0 .55.45 1 1 1s1-.45 1-1v-2c0-.55-.45-1-1-1s-1 .45-1 1zM5.99 4.58c-.39-.39-1.03-.39-1.41 0s-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41L5.99 4.58zm12.37 12.37c-.39-.39-1.03-.39-1.41 0s-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41l-1.06-1.06zm1.06-12.37c-.39-.39-1.03-.39-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06c.39-.38.39-1.02 0-1.41zm-12.37 12.37c-.39-.39-1.03-.39-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06c.38-.38.38-1.02 0-1.41z"
        />
      </svg>
    </button>

    <!-- Loader -->
    <div
      id="loader"
      class="fixed inset-0 z-50 items-center justify-center hidden bg-white dark:bg-black"
    >
      <div
        class="w-10 h-10 border border-black dark:border-white animate-spin"
      ></div>
    </div>

    <div
      class="w-full max-w-md p-6 mx-auto bg-white border border-black dark:border-white dark:bg-black md:p-8"
    >
      <!-- Header -->
      <div class="mb-5 text-center">
        <h1
          class="text-xl tracking-widest text-black uppercase font-orbitron dark:text-white"
        >
          @config(qrcode.title)
        </h1>
        <div
          class="mt-1 text-xs tracking-wider text-gray-500 uppercase dark:text-gray-400"
        >
          @config(qrcode.description)
        </div>
      </div>

      <!-- Camera Stage -->
      <div
        class="relative overflow-hidden my-4 border border-black dark:border-white aspect-[4/3]"
      >
        <div
          id="reader"
          class="w-full h-full bg-gray-100 dark:bg-gray-900"
        ></div>

        <!-- Preview Stage -->
        <div
          id="previewStage"
          class="absolute top-0 left-0 z-10 items-center justify-center hidden w-full h-full bg-gray-100 dark:bg-gray-900"
        >
          <button
            type="button"
            id="closePreviewBtn"
            class="absolute top-2.5 right-2.5 bg-black dark:bg-white text-white dark:text-black w-8 h-8 text-lg flex items-center justify-center z-20 hover:opacity-80 transition-opacity"
          >
            ✕
          </button>
          <img
            id="previewImg"
            alt="Preview QR"
            class="object-contain max-w-full max-h-full"
          >
        </div>

        <!-- Scan Overlay -->
        <div
          class="absolute top-0 left-0 z-20 w-full h-full pointer-events-none"
        >
          <div
            class="absolute h-px -translate-y-1/2 bg-black top-1/2 left-5 right-5 dark:bg-white animate-scan-line opacity-70"
          ></div>
        </div>
      </div>

      <!-- Button Group -->
      <div
        class="grid justify-center grid-cols-2 gap-2 mx-auto my-5 md:grid-cols-3 w-fit"
      >
        <button
          type="button"
          id="stopCamBtn"
          class="px-4 py-2.5 text-xs uppercase tracking-widest border border-black dark:border-white text-black dark:text-white hover:bg-black hover:text-white dark:hover:bg-white dark:hover:text-black transition-colors flex items-center gap-2 hidden"
        >
          @config(qrcode.button.stopCam)
        </button>
        <button
          type="button"
          id="startCamBtn"
          class="px-4 py-2.5 text-xs uppercase tracking-widest border border-black dark:border-white text-black dark:text-white hover:bg-black hover:text-white dark:hover:bg-white dark:hover:text-black transition-colors flex items-center gap-2"
        >
          @config(qrcode.button.startCam)
        </button>
        <button
          type="button"
          id="switchCamBtn"
          class="px-4 py-2.5 text-xs uppercase tracking-widest border border-black dark:border-white text-black dark:text-white hover:bg-black hover:text-white dark:hover:bg-white dark:hover:text-black transition-colors flex justify-center items-center gap-2"
        >
          @config(qrcode.button.switchCam)
        </button>
        <button
          type="button"
          id="openChromeBtn"
          class="px-4 py-2.5 text-xs uppercase tracking-widest border border-black dark:border-white text-black dark:text-white hover:bg-black hover:text-white dark:hover:bg-white dark:hover:text-black transition-colors flex items-center gap-2"
        >
          @config(qrcode.button.openChrome)
        </button>
      </div>

      <!-- Upload Area -->
      <div>
        <label
          id="dropZone"
          for="fileInput"
          class="flex flex-col items-center justify-center gap-2 p-4 transition-colors border-2 border-black border-dashed cursor-pointer dark:border-white hover:bg-black/5 dark:hover:bg-white/5"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="28"
            height="28"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.5"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="text-current"
          >
            <path
              d="M10.3 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v10l-3.1-3.1a2 2 0 0 0-2.814.014L6 21"
            />
            <path d="m14 19.5 3-3 3 3" />
            <path d="M17 22v-5.5" />
            <circle cx="9" cy="9" r="2" />
          </svg>
          <span
            class="text-xs tracking-wider text-gray-500 uppercase dark:text-gray-400"
            >@config(qrcode.text.scanFromFile)</span
          >
        </label>

        <input type="file" id="fileInput" accept="image/*" class="hidden">
      </div>

      <!-- Notification -->
      <div
        id="notifContainer"
        class="z-40 flex-col items-center justify-center hidden w-full gap-3 mt-4 animate-slide-in"
      ></div>

      <button
        class="flex items-center justify-center w-full gap-2 px-6 py-4 mt-4 text-sm tracking-widest text-white uppercase transition-colors bg-black dark:bg-white dark:text-black hover:bg-gray-900 dark:hover:bg-gray-200"
        type="button"
        onclick="window.history.back()"
      >
        <svg
          class="w-4 h-4"
          xmlns="http://www.w3.org/2000/svg"
          width="24"
          height="24"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.5"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="m12 19-7-7 7-7" />
          <path d="M19 12H5" />
        </svg>
        Kembali
      </button>

      <footer class="mt-6 text-xs text-center text-gray-500 dark:text-gray-400">
        @config(qrcode.footer)
      </footer>
    </div>

    <script>
    // ======================= KONFIGURASI =======================
    let html5QrCode = null;
    let currentCameraId = null;
    let isScanning = false;
    const devicesList = [];

    // DOM Elements
    const notifContainer = document.querySelector('#notifContainer');
    const switchBtn = document.querySelector('#switchCamBtn');
    const stopBtn = document.querySelector('#stopCamBtn');
    const startBtn = document.querySelector('#startCamBtn');
    const fileInput = document.querySelector('#fileInput');
    const previewStage = document.querySelector('#previewStage');
    const previewImg = document.querySelector('#previewImg');
    const closePreviewBtn = document.querySelector('#closePreviewBtn');
    const scanLine = document.querySelector('.animate-scan-line');

    function updateCameraButtons() {
      if (isScanning) {
        startBtn.classList.add('hidden');
        stopBtn.classList.remove('hidden');
        switchBtn.classList.remove('hidden');
      } else {
        startBtn.classList.remove('hidden');
        stopBtn.classList.add('hidden');
        switchBtn.classList.add('hidden');
      }
    }

    // Theme
    document.addEventListener('DOMContentLoaded', () => {
      const initTheme = () => {
        const savedTheme = localStorage.getItem('hotspot-theme') || 'dark';
        document.documentElement.classList.toggle(
          'dark',
          savedTheme === 'dark'
        );
        updateThemeIcon(savedTheme);
        updateBodyTheme(savedTheme);
      };

      const toggleTheme = () => {
        const isDark = document.documentElement.classList.toggle('dark');
        const newTheme = isDark ? 'dark' : 'light';
        localStorage.setItem('hotspot-theme', newTheme);
        updateThemeIcon(newTheme);
        updateBodyTheme(newTheme);
      };

      const updateBodyTheme = (theme) => {
        if (theme === 'light') {
          document.body.classList.remove(
            'dark:bg-black',
            'dark:text-white',
            'bg-black',
            'text-white'
          );
          document.body.classList.add('bg-white', 'text-black');
        } else {
          document.body.classList.add('bg-black', 'text-white');
          document.body.classList.remove('bg-white', 'text-black');
        }
      };

      const updateThemeIcon = (theme) => {
        const iconContainer = document.querySelector('.theme-toggle');
        if (iconContainer) {
          if (theme === 'dark') {
            iconContainer.innerHTML =
              '<svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 fill-current" viewBox="0 0 24 24"><path d="M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zM2 13h2c.55 0 1-.45 1-1s-.45-1-1-1H2c-.55 0-1 .45-1 1s.45 1 1 1zm18 0h2c.55 0 1-.45 1-1s-.45-1-1-1h-2c-.55 0-1 .45-1 1s.45 1 1 1zM11 2v2c0 .55.45 1 1 1s1-.45 1-1V2c0-.55-.45-1-1-1s-1 .45-1 1zm0 18v2c0 .55.45 1 1 1s1-.45 1-1v-2c0-.55-.45-1-1-1s-1 .45-1 1zM5.99 4.58c-.39-.39-1.03-.39-1.41 0s-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41L5.99 4.58zm12.37 12.37c-.39-.39-1.03-.39-1.41 0s-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41l-1.06-1.06zm1.06-12.37c-.39-.39-1.03-.39-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06c.39-.38.39-1.02 0-1.41zm-12.37 12.37c-.39-.39-1.03-.39-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06c.38-.38.38-1.02 0-1.41z"/></svg>';
          } else {
            iconContainer.innerHTML =
              '<svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 fill-current" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>';
          }
        }
      };

      const themeToggleBtn = document.querySelector('.theme-toggle');
      if (themeToggleBtn) themeToggleBtn.addEventListener('click', toggleTheme);
      initTheme();
    });

    // Helper functions
    function getNotificationStyle(type) {
      const styles = {
        success: 'border border-green-500 text-green-600 dark:text-green-400',
        error: 'border border-red-500 text-red-600 dark:text-red-400',
        warning:
          'border border-yellow-500 text-yellow-600 dark:text-yellow-400',
        info: 'border border-gray-500 text-gray-600 dark:text-gray-400',
      };

      return `py-3 px-4 w-full font-medium flex items-center gap-3 text-sm border animate-slide-in ${styles[type] || styles.info}`;
    }

    const notifCache = new Map();

    function showNotification(message, type = 'info') {
      const key = `${type}:${message}`;
      const now = Date.now();

      const TTL = type === 'error' ? 4000 : 3000;

      // prevent duplicate notif
      if (notifCache.has(key)) {
        const lastTime = notifCache.get(key);
        if (now - lastTime < TTL) {
          return;
        }
      }

      // store last time
      notifCache.set(key, now);

      // cleanup cache
      setTimeout(() => {
        notifCache.delete(key);
      }, TTL);

      // ================= UI =================
      if (notifContainer.classList.contains('hidden')) {
        notifContainer.classList.remove('hidden');
        notifContainer.classList.add('flex');
      }

      const notif = document.createElement('div');
      notif.className = getNotificationStyle(type);

      const icon =
        type === 'success'
          ? '<svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>'
          : type === 'error'
            ? '<svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>'
            : type === 'warning'
              ? '<svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>'
              : '<svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>';

      notif.innerHTML = `${icon} ${message}`;
      notifContainer.prepend(notif);

      // remove notif
      setTimeout(() => {
        notif.classList.add(
          'opacity-0',
          'translate-y-2',
          'transition-all',
          'duration-300'
        );

        setTimeout(() => {
          notif.remove();
          if (notifContainer.children.length === 0) {
            notifContainer.classList.add('hidden');
          }
        }, 300);
      }, TTL);

      // remove when click
      notif.addEventListener('click', () => {
        notif.remove();
        notifCache.delete(key);
        if (notifContainer.children.length === 0) {
          notifContainer.classList.add('hidden');
        }
      });

      // max 4 notif
      const maxNotif = 4;
      if (notifContainer.children.length > maxNotif) {
        notifContainer.removeChild(notifContainer.lastChild);
      }
    }

    function isValidUrl(str) {
      if (!str) return false;

      try {
        const url = new URL(str.trim());

        if (url.protocol !== 'http:' && url.protocol !== 'https:') {
          return false;
        }

        const decodedQuery = decodeURIComponent(url.search).toLowerCase();
        const hasUser = /(?:\?|&)(username)=/i.test(decodedQuery);
        const hasPass = /(?:\?|&)(password)=/i.test(decodedQuery);

        return hasUser || hasPass;
      } catch (e) {
        return false;
      }
    }

    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/[&<>]/g, (m) => {
        if (m === '&') return '&amp;';
        if (m === '<') return '&lt;';
        if (m === '>') return '&gt;';
        return m;
      });
    }

    function processScannedQR(qrText) {
      if (!qrText || qrText.trim() === '') {
        showNotification('@config(qrcode.notifications.qrInvalid)', 'warning');
        return;
      }

      qrText = qrText.trim();
      const isUrl = isValidUrl(qrText);

      if (isUrl) {
        showNotification('@config(qrcode.notifications.qrSuccess)', 'success');

        setTimeout(() => {
          window.location.href = qrText;
        }, 1000);
      } else {
        let isHotspot = false;
        let wifiName = '',
          wifiPass = '';

        if (qrText.startsWith('WIFI:')) {
          isHotspot = true;
          const ssidMatch = qrText.match(/S:([^;]+)/);
          const passMatch = qrText.match(/P:([^;]+)/);
          if (ssidMatch) wifiName = ssidMatch[1];
          if (passMatch) wifiPass = passMatch[1];

          showNotification(`Hotspot: ${wifiName} berhasil discan`, 'success');
        } else {
          showNotification(
            '@config(qrcode.notifications.qrInvalid)',
            'warning'
          );
        }

        if (isHotspot && wifiPass) {
          const copyBtn = document.createElement('button');
          copyBtn.className =
            'bg-black/5 dark:bg-white/5 border border-black/5 dark:border-white/10 rounded-full px-5 py-2 text-slate-900 dark:text-white font-semibold text-sm cursor-pointer transition-all hover:scale-95 inline-flex items-center gap-1.5';
          copyBtn.innerHTML = '📋 Copy Password';
          copyBtn.onclick = () => {
            navigator.clipboard.writeText(wifiPass);
            showNotification(
              'Password hotspot disalin ke clipboard!',
              'success'
            );
          };
        } else if (!isUrl && !isHotspot && qrText.length > 0) {
          const copyTextBtn = document.createElement('button');
          copyTextBtn.className =
            'bg-black/5 dark:bg-white/5 border border-black/5 dark:border-white/10 rounded-full px-5 py-2 text-slate-900 dark:text-white font-semibold text-sm cursor-pointer transition-all hover:scale-95 inline-flex items-center gap-1.5';
          copyTextBtn.innerHTML = '📋 Copy Teks';
          copyTextBtn.onclick = () => {
            navigator.clipboard.writeText(qrText);
            showNotification('Teks QR disalin!', 'success');
          };
        }
      }
    }

    // ===================== KAMERA & QR SCANNER =====================
    async function loadCameras() {
      try {
        const devices = await Html5Qrcode.getCameras();

        devicesList.length = 0;
        devices.forEach((d) => {
          devicesList.push({
            id: d.id,
            label: d.label,
          });
        });

        const backCam = devicesList.find(
          (d) =>
            d.label.toLowerCase().includes('back') ||
            d.label.toLowerCase().includes('rear')
        );

        currentCameraId = backCam ? backCam.id : devicesList[0]?.id;

        console.log('Selected camera:', currentCameraId);
      } catch (err) {
        console.error(err);
      }
    }

    let currentTrack = null;

    function setupCameraTrack() {
      const videoElem = document.querySelector('#reader video');

      if (videoElem?.srcObject) {
        const tracks = videoElem.srcObject.getVideoTracks();

        if (tracks.length > 0) {
          currentTrack = tracks[0];
          console.log('Camera track ready');
        }
      }
    }

    async function initAndStartCamera() {
      if (html5QrCode && isScanning) return;

      try {
        const readerElement = document.getElementById('reader');
        if (readerElement) readerElement.innerHTML = '';

        html5QrCode = new Html5Qrcode('reader');

        const qrboxFunction = (viewfinderWidth, viewfinderHeight) => {
          const minEdgeSize = Math.min(viewfinderWidth, viewfinderHeight);
          const qrboxSize = Math.floor(minEdgeSize * 1);
          return {
            width: qrboxSize,
            height: qrboxSize,
          };
        };

        const config = {
          fps: 30,
          qrbox: qrboxFunction,
          aspectRatio: 4 / 3,
          showTorchButtonIfSupported: true,
          videoConstraints: {
            deviceId: { exact: currentCameraId },
            width: { ideal: 1280 },
            height: { ideal: 720 },
            advanced: [{ focusMode: 'continuous' }],
          },
        };

        await html5QrCode.start(
          { deviceId: { exact: currentCameraId } },
          config,
          (decodedText) => {
            if (decodedText?.trim()) {
              processScannedQR(decodedText);
            }
          }
        );
        setTimeout(setupCameraTrack, 500);

        isScanning = true;
        updateCameraButtons();
        showNotification('@config(qrcode.notifications.camStart)', 'info');
      } catch (err) {
        console.error('Start camera failed:', err);
        showNotification(
          `@config(qrcode.notifications.camFailed): ${err}`,
          'error'
        );
        html5QrCode = null;
        isScanning = false;
        updateCameraButtons();
      }
    }

    async function stopCamera() {
      if (html5QrCode && isScanning) {
        try {
          await html5QrCode.stop();
          await html5QrCode.clear();
          isScanning = false;
        } catch (err) {
          console.warn('Stop error:', err);
        }
      }
      html5QrCode = null;
      isScanning = false;
      updateCameraButtons();
    }

    async function switchCamera() {
      if (!isScanning) {
        showNotification('@config(qrcode.notifications.camFailed)', 'warning');
        return;
      }

      if (!devicesList || devicesList.length < 2) {
        showNotification(
          '@config(qrcode.notifications.camNotAvailable)',
          'warning'
        );
        return;
      }

      try {
        let nextId;
        if (!currentCameraId) {
          nextId = devicesList[0].id;
        } else {
          const currentIdx = devicesList.findIndex(
            (d) => d.id === currentCameraId
          );
          nextId = devicesList[(currentIdx + 1) % devicesList.length].id;
        }

        currentCameraId = nextId;

        await stopCamera();

        html5QrCode = new Html5Qrcode('reader');

        const qrboxFunction = (viewfinderWidth, viewfinderHeight) => {
          const minEdgeSize = Math.min(viewfinderWidth, viewfinderHeight);
          const qrboxSize = Math.floor(minEdgeSize * 1);
          return { width: qrboxSize, height: qrboxSize };
        };

        const config = {
          fps: 30,
          qrbox: qrboxFunction,
          aspectRatio: 4 / 3,
          showTorchButtonIfSupported: true,
          videoConstraints: {
            deviceId: { exact: currentCameraId },
            width: { ideal: 1280 },
            height: { ideal: 720 },
            advanced: [{ focusMode: 'continuous' }],
          },
        };

        await html5QrCode.start(
          { deviceId: { exact: currentCameraId } },
          config,
          (decodedText) => {
            if (decodedText && decodedText.trim() !== '') {
              processScannedQR(decodedText);
            }
          }
        );
        setTimeout(setupCameraTrack, 500);

        isScanning = true;
        updateCameraButtons();
        showNotification(
          '@config(qrcode.notifications.camSwitching)',
          'success'
        );
      } catch (err) {
        console.error('Switch camera error:', err);
        showNotification(
          '@config(qrcode.notifications.camSwitchingFailed)',
          'error'
        );
        if (!isScanning) {
          initAndStartCamera().catch((e) => console.warn(e));
        }
      }
    }

    const readerElement = document.querySelector('#reader');
    let lastFocusTime = 0;

    readerElement.addEventListener('click', async () => {
      const now = Date.now();
      if (now - lastFocusTime < 800) return;
      lastFocusTime = now;

      try {
        const track = html5QrCode?.getRunningTrack();
        if (!track) return;

        const capabilities = track.getCapabilities();

        if (capabilities.focusMode) {
          await track.applyConstraints({
            advanced: [{ focusMode: 'continuous' }],
          });
        }
      } catch (e) {
        console.warn(e);
      }
    });

    // ===================== UPLOAD FILE =====================
    const dropZone = document.getElementById('dropZone');

    ['dragenter', 'dragover', 'dragleave', 'drop'].forEach((eventName) => {
      dropZone.addEventListener(eventName, (e) => {
        e.preventDefault();
        e.stopPropagation();
      });
    });

    ['dragenter', 'dragover'].forEach((eventName) => {
      dropZone.addEventListener(eventName, () => {
        dropZone.classList.add('bg-black/5', 'dark:bg-white/5');
      });
    });

    ['dragleave', 'drop'].forEach((eventName) => {
      dropZone.addEventListener(eventName, () => {
        dropZone.classList.remove('bg-black/5', 'dark:bg-white/5');
      });
    });

    dropZone.addEventListener('drop', (e) => {
      const files = e.dataTransfer.files;
      if (files && files.length > 0) {
        fileInput.files = files;
        fileInput.dispatchEvent(new Event('change'));
      }
    });

    function showImagePreview(file) {
      if (file) {
        const reader = new FileReader();
        reader.onload = (e) => {
          previewImg.src = e.target.result;
          previewStage.style.display = 'flex';
        };
        reader.readAsDataURL(file);
      } else {
        previewStage.style.display = 'none';
        previewImg.src = '';
      }
    }

    function hidePreview() {
      previewStage.style.display = 'none';
      previewImg.src = '';
      fileInput.value = '';
    }

    async function onFileSelected(file) {
      if (!file) return;
      scanLine.classList.add('[animation-duration:1s]');

      const wasScanning = isScanning;
      if (wasScanning) {
        await stopCamera();
      }

      showImagePreview(file);

      const tempScanner = new Html5Qrcode('reader');

      try {
        const result = await tempScanner.scanFile(file, true);
        if (result && result.trim() !== '') {
          processScannedQR(result);
        }
      } catch (err) {
        console.error('Scan file error:', err);
        showNotification('@config(qrcode.notifications.qrNotFound)', 'error');
      } finally {
        try {
          await tempScanner.clear();
        } catch (e) {}
      }
    }

    async function backToCamera() {
      hidePreview();
      if (!isScanning) {
        await initAndStartCamera();
      }
    }

    function openInChrome() {
      const isAndroid = /android/i.test(navigator.userAgent);
      if (!isAndroid) {
        showNotification(
          '@config(qrcode.notifications.openWithChrome)',
          'info'
        );
        return;
      }
      const currentUrl = window.location.href;
      const urlWithoutProtocol = currentUrl.replace(/^https?:\/\//, '');
      const intentUrl = `intent://${urlWithoutProtocol}#Intent;scheme=http;package=com.android.chrome;end;`;
      window.location.href = intentUrl;
      setTimeout(() => {
        showNotification(
          'Jika Chrome tidak terbuka, pastikan Chrome terinstall. Buka tautan secara manual.',
          'warning'
        );
      }, 1500);
    }

    // ===================== EVENT LISTENERS =====================
    fileInput.addEventListener('change', (event) => {
      const file = event.target.files[0];
      if (file) {
        onFileSelected(file);
      } else {
        hidePreview();
      }
    });

    closePreviewBtn.addEventListener('click', () => {
      scanLine.classList.add('[animation-duration:3s]');
      backToCamera();
    });

    switchBtn.addEventListener('click', () => {
      if (previewStage.style.display === 'flex') {
        backToCamera().then(() => {
          setTimeout(() => switchCamera(), 500);
        });
      } else {
        switchCamera();
      }
    });

    stopBtn.addEventListener('click', () => {
      stopCamera();
      showNotification('@config(qrcode.notifications.camStop)', 'info');
      hidePreview();
    });

    startBtn.addEventListener('click', () => {
      if (previewStage.style.display === 'flex') {
        backToCamera();
      } else if (!isScanning) {
        initAndStartCamera();
      } else {
        showNotification(
          '@config(qrcode.notifications.camAlreadyActive)',
          'info'
        );
      }
    });

    openChromeBtn.addEventListener('click', openInChrome);

    // ===================== INITIALIZATION =====================
    let initialized = false;

    window.addEventListener('load', async () => {
      if (!initialized) {
        initialized = true;
        await loadCameras();
        setTimeout(() => {
          initAndStartCamera().catch((err) => {
            console.error('Init camera failed:', err);
            showNotification(
              `@config(qrcode.notifications.camInitFailed): ${err}`,
              'info'
            );
          });
        }, 100);
      }
    });

    window.addEventListener('beforeunload', async () => {
      if (html5QrCode && isScanning) {
        try {
          await html5QrCode.stop();
          await html5QrCode.clear();
        } catch (e) {}
      }
    });
    </script>
  </body>
</html>
